name: Обновить наличие
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/update_stock.py .
      - name: Сохранить изменения
        run: |
          git config user.name "kugappiy-prog"
          git config user.email "kugappiy-prog@users.noreply.github.com"
          git add stock.json
          git diff --cached --quiet || (git commit -m "Обновить наличие" && git push)
